<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Buddy Pro</title>
<style>
html,body{margin:0;height:100%;background:#020617}
iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0}
#m{position:fixed;top:0;left:0;right:0;z-index:9;background:#0f172a;color:#94a3b8;font-family:sans-serif;padding:12px 16px;font-size:13px;line-height:1.5}
#m b{color:#34d399}
.err{color:#f87171;white-space:pre-wrap}
</style>
</head>
<body>
<div id="m"><b>Chargement de Gym Buddy Pro…</b><br>Patiente : la première fois peut prendre jusqu'à 1 minute.</div>
<script>
var m = document.getElementById("m");
function show(html) { m.innerHTML = html; }
window.addEventListener("message", function (ev) {
  var d = ev.data || {};
  if (d.gymError) show("<b>⚠️ Erreur de l'application :</b><br><span class='err'>" + String(d.gymError).slice(0, 400) + "</span>");
});
fetch("https://raw.githubusercontent.com/fredolantern-lgtm/gym-buddy-pro/main/gym-buddy-pro%20%281%29.html")
.then(function (r) { return r.text(); })
.then(function (t) {
  t = t.replace("Recharts.production.min.js", "Recharts.js");
  t = t.replace("<body>", "<body><script>window.__e=function(x){try{parent.postMessage({gymError:String(x)},'*')}catch(e){}};window.onerror=function(a,b,c){window.__e('Erreur JS ligne '+c+' : '+a)};var ce=console.error;console.error=function(){window.__e(Array.prototype.join.call(arguments,' '));ce.apply(console,arguments)};<\/script>");
  var f = document.createElement("iframe");
  f.srcdoc = t;
  document.body.appendChild(f);
  var n = 0;
  var iv = setInterval(function () {
    n = n + 1;
    try {
      var w = f.contentWindow;
      var rd = w ? w.document : null;
      var root = rd ? rd.getElementById("root") : null;
      if (root && root.children.length > 0) {
        m.style.display = "none";
        clearInterval(iv);
      } else if (n === 25) {
        if (!w.React) show("<b>⚠️ React n'a pas pu être téléchargé.</b> Problème de connexion internet ?");
        else if (!w.Babel) show("<b>⚠️ Babel n'a pas pu être téléchargé.</b>");
        else if (!w.Recharts) show("<b>⚠️ Le composant graphique n'a pas pu être téléchargé.</b>");
        else show("<b>Compilation en cours… le lancement prend plus de 25 s</b>");
      } else if (n > 120) {
        clearInterval(iv);
        show("<b>L'application n'a pas démarré.</b> Fais une capture de cette page.");
      }
    } catch (e) {
      clearInterval(iv);
      show("<b>Erreur :</b> " + e);
    }
  }, 1000);
})
.catch(function (e) { show("<b>Erreur de téléchargement :</b> " + e); });
</script>
</body>
</html>
